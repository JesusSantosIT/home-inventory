name: Build and Push Docker Image

'on':
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/home-inventory

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello"
